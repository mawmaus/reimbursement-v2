<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f5f4f2" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)" />
<title>Offline · Cibes Reimbursement Portal</title>
<!-- Shown by sw.js when a page can't be loaded. Self-contained (inline styles,
     no styles.css) so it renders from the offline cache alone. -->
<style>
  :root { --bg: #f5f4f2; --surface: #ffffff; --text: #2a2a2c; --muted: #6d6d75; --line: #dedcd8; --pine: #f7982a; --pine-hover: #ec8a17; --on-brand: #231a0f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #131315; --surface: #1c1c1f; --text: #ecebe8; --muted: #9a99a0; --line: #35353b; }
  }
  :root[data-theme="dark"] { --bg: #131315; --surface: #1c1c1f; --text: #ecebe8; --muted: #9a99a0; --line: #35353b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Thai", "Noto Sans Khmer", sans-serif;
    display: grid; place-items: center; padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 380px; text-align: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 32px 24px 28px; box-shadow: 0 8px 28px rgba(0, 0, 0, .06);
  }
  .logo { height: 34px; margin-bottom: 22px; }
  .dot { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center;
         background: color-mix(in srgb, var(--pine) 16%, transparent); color: var(--pine); font-size: 1.5rem; }
  h1 { font-size: 1.15rem; margin: 0 0 6px; }
  p { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }
  .btn {
    display: inline-block; min-width: 140px; padding: 11px 20px; border-radius: 10px;
    background: var(--pine); color: var(--on-brand); border: 1px solid var(--pine-hover);
    font-weight: 600; text-decoration: none;
  }
  .btn:active { transform: translateY(1px); }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/logo.svg" alt="Cibes" />
    <div class="dot" aria-hidden="true">⟳</div>
    <h1 id="offTitle">You're offline</h1>
    <p id="offText">The portal needs an internet connection. Check your connection, then try again.</p>
    <a class="btn" id="offRetry" href="/">Try again</a>
  </main>
  <script src="/offline.js"></script>
</body>
</html>
