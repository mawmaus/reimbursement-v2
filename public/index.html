<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cibes Reimbursement Portal</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Reimbursement" />
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <img class="logo logo-lg" src="logo.svg" alt="Cibes" />
      <div>
        <h1 data-i18n="Reimbursement Portal">Reimbursement Portal</h1>
        <p class="muted" data-i18n="Sign in to submit, approve, or process claims.">Sign in to submit, approve, or process claims.</p>
      </div>
    </div>
    <form id="loginForm" class="form" autocomplete="on">
      <label><span data-i18n="Username">Username</span>
        <input name="username" type="text" required autocomplete="username" />
      </label>
      <label><span data-i18n="Password">Password</span>
        <div class="pw-wrap">
          <input name="password" type="password" required autocomplete="current-password" />
          <button type="button" class="pw-toggle" data-i18n-aria="Show password" aria-label="Show password">👁</button>
        </div>
      </label>
      <p id="loginError" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="Sign in">Sign in</button>
    </form>

    <p class="login-hint muted" id="loginHint"></p>

    <div class="login-lang">
      <div class="topbar-ctl">
        <select id="loginLang" data-icon="🌐" aria-label="Language"></select>
      </div>
      <button type="button" id="loginTheme" class="theme-btn" data-theme-toggle aria-label="Dark mode">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appView" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <img class="logo logo-sm" src="logo.svg" alt="Cibes" />
      <span class="topbar-title" data-i18n="Reimbursement Portal">Reimbursement Portal</span>
    </div>
    <!-- Grouped so phones can lay the header out as tidy rows (see the
         ≤720px .topbar grid): who's signed in + quick prefs, then the region /
         language context, then the create menu and the icon actions. -->
    <div class="topbar-right">
      <span id="userBadge" class="user-badge"></span>
      <div class="tb-group tb-context">
        <div class="topbar-ctl" id="regionPicker" title="Region" hidden>
          <select id="regionSelect" data-icon="📍" aria-label="Region"></select>
        </div>
        <div class="topbar-ctl">
          <select id="topLang" data-icon="🌐" aria-label="Language"></select>
        </div>
      </div>
      <div class="tb-group tb-prefs">
      <button type="button" id="topTheme" class="theme-btn" data-theme-toggle aria-label="Dark mode">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      </button>
      <!-- Release notes (public/changelog.js). Dotted while a release is unread. -->
      <button type="button" id="whatsNewBtn" class="theme-btn whatsnew-btn" data-i18n-aria="What's new" data-i18n-title="What's new" aria-label="What's new" title="What's new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
      </button>
      </div>
      <span class="tb-sep" aria-hidden="true"></span>
      <div class="tb-group tb-actions">
      <!-- The three "New …" purposes share one menu. Each item keeps the id the
           old standalone button had, so gating (hidden), the cash-advance hold
           (disabled + title) and draft dots still target it directly.
           syncNewMenu() hides the trigger when every item is hidden and mirrors
           any draft dot onto it. -->
      <div class="new-menu-wrap" id="newMenuWrap" hidden>
        <button type="button" id="newMenuBtn" class="btn btn-primary btn-sm new-menu-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="newMenu">
          <svg class="nm-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="New">New</span>
          <svg class="nm-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="new-menu" id="newMenu" role="menu" hidden>
          <button type="button" id="newClaimBtn" class="new-item" role="menuitem" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6M9 15h6"/></svg>
            <span data-i18n="New claim">New claim</span>
          </button>
          <button type="button" id="newMealBtn" class="new-item" role="menuitem" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
            <span data-i18n="New meal allowance">New meal allowance</span>
          </button>
          <button type="button" id="newAdvanceBtn" class="new-item" role="menuitem" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
            <span data-i18n="New cash advance">New cash advance</span>
          </button>
          <!-- Why the claim / meal items are greyed out (cash-advance hold). A
               title alone never shows on touch screens. -->
          <p class="new-menu-note" id="newMenuNote" hidden></p>
        </div>
      </div>
      <span class="tb-sep" aria-hidden="true"></span>
      <!-- Icon-only actions: the translated aria-label doubles as the hover
           tooltip (.icon-btn::after), so there is one string per button. -->
      <button type="button" id="exportBtn" class="btn btn-green-soft btn-sm icon-btn" hidden data-i18n-aria="Export CSV" aria-label="Export CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      </button>
      <button type="button" id="profileBtn" class="btn btn-indigo-soft btn-sm icon-btn" data-i18n-aria="Profile" aria-label="Profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </button>
      <button type="button" id="accountsBtn" class="btn btn-brand-soft btn-sm icon-btn" hidden data-i18n-aria="Manage accounts" aria-label="Manage accounts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
      <button type="button" id="settingsBtn" class="btn btn-brand-soft btn-sm icon-btn" hidden data-i18n-aria="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      </div>
    </div>
    <button type="button" id="logoutBtn" class="btn btn-danger-ghost btn-sm icon-btn topbar-signout" data-i18n-aria="Sign out" aria-label="Sign out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </header>

  <main class="container">
    <!-- Clean landing after login: pick a list to open. -->
    <section id="homeView" class="home">
      <p class="home-greeting" id="homeGreeting"></p>
      <!-- Why "New claim" / "New meal allowance" are greyed out, when they are:
           an unrealized cash advance holds them. Filled by renderHome(). -->
      <div class="home-notice" id="advanceHoldNotice" hidden></div>
      <div class="home-menu" id="homeMenu"></div>
    </section>

    <!-- Expense insights (charts), opened from a home tile. -->
    <section id="insightsView" hidden>
      <div class="list-head">
        <button id="backHomeInsights" class="btn btn-ghost btn-sm" type="button" data-i18n="← Menu">← Menu</button>
        <h2 class="list-title" data-i18n="Insights">Insights</h2>
        <span id="insightsScope" class="insights-scope"></span>
      </div>
      <div id="insightsBody"></div>
    </section>

    <!-- Date-change requests, opened from a home tile. A claimant sees their
         returned claims and can ask for the locked dates to be unlocked; a
         Super Admin sees the queue and decides. -->
    <section id="dcView" hidden>
      <div class="list-head">
        <button id="backHomeDc" class="btn btn-ghost btn-sm" type="button" data-i18n="← Menu">← Menu</button>
        <h2 class="list-title" data-i18n="Request change of date">Request change of date</h2>
      </div>
      <div id="dcBody"></div>
    </section>

    <!-- One claims list, opened from a home tile. -->
    <section id="listView" hidden>
      <div class="list-head">
        <button id="backHome" class="btn btn-ghost btn-sm" type="button" data-i18n="← Menu">← Menu</button>
        <h2 class="list-title" id="listTitle"></h2>
        <span id="refreshStamp" class="refresh-stamp" hidden></span>
        <button id="refreshBtn" class="btn btn-ghost btn-sm refresh-btn" type="button" data-i18n-title="Reload claims and statuses" title="Reload claims and statuses">
          <span class="refresh-icon" aria-hidden="true">↻</span> <span data-i18n="Refresh">Refresh</span>
        </button>
      </div>

      <section id="summaryCards" class="cards"></section>

      <section class="toolbar">
        <div class="toolbar-left">
          <input id="searchInput" class="input" type="search" data-i18n-ph="Search claim no, name, type, DB…" placeholder="Search claim no, name, type, DB…" />
          <select id="statusFilter" class="input">
            <option value="" data-i18n="All statuses">All statuses</option>
            <option value="pending_manager" data-i18n="Pending Review - Manager">Pending Review - Manager</option>
            <option value="pending_finance" data-i18n="Pending Review - FinanceAP">Pending Review - FinanceAP</option>
            <option value="approved" data-i18n="Approved">Approved</option>
            <option value="rejected" data-i18n="Rejected">Rejected</option>
            <option value="paid" data-i18n="Paid">Paid</option>
          </select>
          <select id="deptFilter" class="input"><option value="" data-i18n="All departments">All departments</option></select>
          <select id="claimantFilter" class="input" data-search="always"><option value="" data-i18n="All claimants">All claimants</option></select>
          <!-- Paid-claims view only: narrow the list by payment date. -->
          <div id="paidRange" class="date-range" hidden>
            <span class="date-range-lab" data-i18n="Paid on">Paid on</span>
            <input id="paidFrom" class="input" type="date" data-i18n-aria="Paid from" aria-label="Paid from" />
            <span class="date-range-sep" aria-hidden="true">–</span>
            <input id="paidTo" class="input" type="date" data-i18n-aria="Paid to" aria-label="Paid to" />
            <button id="paidRangeClear" class="date-range-clear" type="button" hidden data-i18n-aria="Clear payment date filter" aria-label="Clear payment date filter">×</button>
          </div>
        </div>
      </section>

      <!-- What the list covers (recent window vs all history), with the switch. -->
      <p id="ledgerScope" class="ledger-scope" aria-live="polite" hidden></p>

      <div id="selectionBar" class="selection-bar" hidden>
        <span id="selCount" class="sel-count"></span>
        <div class="sel-actions">
          <button id="clearSelBtn" class="btn btn-ghost btn-sm" type="button" data-i18n="Clear">Clear</button>
          <button id="markPaidSelBtn" class="btn btn-green-soft btn-sm" type="button" hidden data-i18n="Mark as paid">Mark as paid</button>
          <button id="revertPaidSelBtn" class="btn btn-amber-soft btn-sm" type="button" hidden data-i18n="Revert payment">Revert payment</button>
          <button id="deleteSelBtn" class="btn btn-danger btn-sm" type="button" hidden data-i18n="Delete">Delete</button>
          <button id="genPdfBtn" class="btn btn-primary btn-sm" type="button" data-i18n="Download PDF">Download PDF</button>
        </div>
      </div>

      <section class="ledger">
        <div class="ledger-head">
          <span class="col-spine"></span>
          <span class="col-check"><input type="checkbox" id="selectAll" data-i18n-aria="Select all claims" aria-label="Select all claims" /></span>
          <span class="col-no" data-sort="no" role="button" tabindex="0" data-i18n="Claim">Claim</span>
          <span class="col-name" data-sort="name" role="button" tabindex="0" data-i18n="Claimant">Claimant</span>
          <span class="col-db" data-sort="db" role="button" tabindex="0" data-i18n="No DB">No DB</span>
          <span class="col-type" data-sort="type" role="button" tabindex="0" data-i18n="Expense">Expense</span>
          <span class="col-date" data-sort="date" role="button" tabindex="0" data-i18n="Date">Date</span>
          <span class="col-paid" data-sort="paid" role="button" tabindex="0" data-i18n="Paid on">Paid on</span>
          <span class="col-amt" data-sort="amount" role="button" tabindex="0" data-i18n="Amount">Amount</span>
          <span class="col-status" data-sort="status" role="button" tabindex="0" data-i18n="Status">Status</span>
        </div>
        <div id="claimRows"></div>
        <p id="emptyState" class="empty muted" hidden data-i18n="No claims yet.">No claims yet.</p>
      </section>
    </section>
  </main>
</div>

<!-- DRAWER (claim detail) -->
<div id="drawerScrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Claim detail"></aside>

<!-- MODAL (forms) -->
<div id="modalScrim" class="scrim" hidden></div>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>

<!-- MODAL 2 (sub-forms that stack over a modal, e.g. add/edit user) -->
<div id="modal2Scrim" class="scrim scrim-2" hidden></div>
<div id="modal2" class="modal modal-2" hidden role="dialog" aria-modal="true"></div>

<div id="toast" class="toast" hidden></div>

<!-- iPhone/iPad "Add to Home Screen" hint — iOS has no install prompt, so we
     explain it. Shown by initIosInstallHint() only on iOS, outside the
     installed app, until dismissed. -->
<aside id="iosInstallHint" class="ios-hint" hidden role="note">
  <img class="ios-hint-icon" src="icons/icon-192.png" alt="" />
  <div class="ios-hint-body">
    <strong data-i18n="Install this app on your iPhone">Install this app on your iPhone</strong>
    <span class="ios-hint-steps">
      <svg class="ios-hint-share" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="Tap Share, then “Add to Home Screen”.">Tap Share, then “Add to Home Screen”.</span>
    </span>
  </div>
  <button type="button" class="x-btn ios-hint-close" id="iosInstallHintClose" data-i18n-aria="Dismiss" aria-label="Dismiss">×</button>
</aside>

<script src="i18n.js"></script>
<script src="changelog.js"></script>
<script src="app.js"></script>
</body>
</html>
